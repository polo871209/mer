default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
    { id = "gitleaks", name = "gitleaks staged changes" },
    { id = "gitleaks", alias = "gitleaks-history", name = "gitleaks full history", entry = "gitleaks git --redact --verbose", stages = [
        "pre-push",
    ] },
]

[[repos]]
repo = "builtin"
hooks = [
    { id = "detect-private-key" },
    { id = "check-added-large-files", args = [
        "--maxkb=1024",
    ] },
]

[[repos]]
repo = "local"
hooks = [
    { id = "swift-format", name = "swift format", entry = "swift format format --in-place --parallel", language = "system", types = [
        "swift",
    ], files = "^Mer(Widget)?/" },
    { id = "swift-format-lint", name = "swift format lint", entry = "swift format lint --strict --parallel", language = "system", types = [
        "swift",
    ], files = "^Mer(Widget)?/" },
]
